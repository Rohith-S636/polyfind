name: Verify

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/polyfind_test_password
        ports:
          - 7687:7687
        options: >-
          --health-cmd="cypher-shell -u neo4j -p polyfind_test_password 'RETURN 1' || exit 1"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=30
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: polyfind_test
          MYSQL_USER: polyfind_test
          MYSQL_PASSWORD: polyfind_test_password
          MYSQL_ROOT_PASSWORD: polyfind_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppolyfind_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      TEST_DATABASE_URL: mysql://polyfind_test:polyfind_test_password@127.0.0.1:3306/polyfind_test
      POLYFIND_REDIS_TEST_URL: redis://127.0.0.1:6379
      POLYFIND_NEO4J_TEST_URI: bolt://127.0.0.1:7687
      POLYFIND_NEO4J_TEST_USERNAME: neo4j
      POLYFIND_NEO4J_TEST_PASSWORD: polyfind_test_password
      POLYFIND_LANCEDB_TEST_PATH: /tmp/polyfind-lancedb-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:scripts
      - run: npm test
      - run: npm run build
