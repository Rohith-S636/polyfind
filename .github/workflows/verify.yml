name: Verify

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/polyfind_test_password
        ports:
          - 7687:7687
        options: >-
          --health-cmd="cypher-shell -u neo4j -p polyfind_test_password 'RETURN 1' || exit 1"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=30
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: polyfind_test
          MYSQL_USER: polyfind_test
          MYSQL_PASSWORD: polyfind_test_password
          MYSQL_ROOT_PASSWORD: polyfind_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppolyfind_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      # Integration tests use an isolated disposable database; benchmark seeding uses polyfind_test only.
      TEST_DATABASE_URL: mysql://polyfind_test:polyfind_test_password@127.0.0.1:3306/polyfind_integration_test
      POLYFIND_TEST_DATABASE_URL: mysql://polyfind_test:polyfind_test_password@127.0.0.1:3306/polyfind_integration_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
      DATABASE_URL: mysql://polyfind_test:polyfind_test_password@127.0.0.1:3306/polyfind_test
      CATALOG_MODE: live
      CI_MYSQL_ROOT_PASSWORD: polyfind_root_password
      CI_MYSQL_APP_USER: polyfind_test
      CI_MYSQL_INTEGRATION_DATABASE: polyfind_integration_test
      REDIS_URL: redis://127.0.0.1:6379
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: polyfind_test_password
      NEO4J_DATABASE: neo4j
      LANCEDB_PATH: /tmp/polyfind-benchmark-lancedb
      POLYFIND_BENCHMARK_DISPOSABLE: "true"
      POLYFIND_BENCHMARK_DATASET_SIZE: "50"
      POLYFIND_BENCHMARK_OPERATIONS: "100"
      POLYFIND_BENCHMARK_RUNS: "3"
      POLYFIND_BENCHMARK_SEED: "42"
      POLYFIND_REDIS_TEST_URL: redis://127.0.0.1:6379
      POLYFIND_NEO4J_TEST_URI: bolt://127.0.0.1:7687
      POLYFIND_NEO4J_TEST_USERNAME: neo4j
      POLYFIND_NEO4J_TEST_PASSWORD: polyfind_test_password
      POLYFIND_LANCEDB_TEST_PATH: /tmp/polyfind-lancedb-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare isolated disposable MySQL integration database
        run: npm run prepare:ci-db
      - run: npm run typecheck
      - run: npm run typecheck:scripts
      - run: npm test
      - name: Prepare disposable benchmark catalogue
        run: |
          npm run migrate
          npm run seed -- --seed=42 --count=50
      - name: Run repeated live multi-store benchmark
        run: npm run benchmark:integration
      - name: Upload measured benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: polyfind-measured-benchmark
          path: artifacts/polyfind-benchmark-*.json
          if-no-files-found: error
      - run: npm run build
  docker-stack:
    name: Docker Compose stack smoke test
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies and Playwright
        run: |
          npm ci
          npm install --no-save @playwright/test@1.57.0
          npx playwright install --with-deps chromium
      - name: Create disposable Compose environment
        run: |
          cat > .env <<'EOF'
          MYSQL_PASSWORD=ci-polyfind-password
          MYSQL_ROOT_PASSWORD=ci-polyfind-root-password
          NEO4J_AUTH=neo4j/ci-polyfind-neo4j
          NEO4J_PASSWORD=ci-polyfind-neo4j
          AUTH_BOOTSTRAP_TOKEN=ci-polyfind-bootstrap-token-with-more-than-32-characters
          CORS_ORIGIN=http://localhost:3000
          EOF
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production application image
        run: docker compose build app
      - name: Start disposable database services
        run: docker compose up -d --wait mysql redis neo4j
      - name: Migrate and seed the disposable Compose database
        run: |
          docker compose run --rm --no-deps app npm run migrate
          docker compose run --rm --no-deps app npm run seed -- --seed=42 --count=50
      - name: Start application and wait for readiness
        run: docker compose up -d --wait app
      - name: Smoke test browser UI and API through the Next.js proxy
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/api/ready
          curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null
          node -e "fetch('http://127.0.0.1:3000/api/products').then(async r => { const body = await r.json(); if (!r.ok || Number(body.total) < 50) throw new Error('Expected at least 50 seeded products; received ' + body.total); console.log('Docker UI/API smoke test passed with ' + body.total + ' products.'); }).catch(error => { console.error(error); process.exitCode = 1; });"
      - name: Run browser acceptance for customer and administrator journeys
        env:
          POLYFIND_E2E_BOOTSTRAP_TOKEN: ci-polyfind-bootstrap-token-with-more-than-32-characters
        run: npx playwright test e2e/polyfind.spec.mjs --workers=1 --reporter=line --timeout=60000 --global-timeout=240000
      - name: Collect Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop and remove only this CI job's disposable Compose volumes
        if: always()
        run: docker compose down -v --remove-orphans
