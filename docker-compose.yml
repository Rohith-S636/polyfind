services:
  # ─── MySQL ──────────────────────────────────────────────────────────────────
  # Used for Docker-based full-stack deployments.
  # For local Windows development, use the native MySQL 8.0 service instead
  # (port 3306 is already occupied by MySQL80 Windows service).
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: polyfind
      MYSQL_USER: polyfind
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - polyfind-mysql:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u polyfind --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ─── Redis 8 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - polyfind-redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Neo4j 5 Community ──────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/PolyFindNeo4j2026!}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - polyfind-neo4j-data:/data
      - polyfind-neo4j-logs:/logs
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ─── App (production Docker deployment only) ─────────────────────────────────
  # For local development, run: npm run dev
  # This service is for full Docker-stack or production builds only.
  app:
    build: .
    environment:
      NODE_ENV: production
      CATALOG_MODE: live
      DATABASE_URL: mysql://polyfind:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@mysql:3306/polyfind
      REDIS_URL: redis://redis:6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-PolyFindNeo4j2026!}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      LANCEDB_PATH: /app/data/lancedb
      LANCEDB_TABLE: ${LANCEDB_TABLE:-product_embeddings}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      API_PORT: 3001
      PORT: 3000
      AUTH_BOOTSTRAP_TOKEN: ${AUTH_BOOTSTRAP_TOKEN:-}
    ports:
      - "3000:3000"
    volumes:
      - polyfind-lancedb:/app/data/lancedb
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

volumes:
  polyfind-mysql:
  polyfind-redis:
  polyfind-neo4j-data:
  polyfind-neo4j-logs:
  polyfind-lancedb:
